deploy:
  provider: elasticbeanstalk
  access_key_id: 
  secret_access_key: 
  region: us-east-1
  app: swe1-app
  env: django-env
  bucket: <bucket>
  edge: true # opt in to dpl v2
  on:
    branch: main

dist: focal
language: python
install:
  - pip install -r requirements.txt black
  - pip install coverage
  - pip install coveralls
  - pip install flake8
script:
  - black --check
  -python manage.py test
